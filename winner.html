<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>NeverWord</title> <!--Browser Tab Title-->
	<link rel="stylesheet" href="./winner.css">
</head>
<body>
	<header class="win-header">
		<p class="win-eyebrow">ROUND OVER</p>
		<h1>YOU WIN!</h1>
	</header>
	<main>
		<h2>Well played!</h2>
		<nav class="win-actions" aria-label="Game options">
			<a class="win-button" href="./start.html">Play Again With Same Players</a>
			<a class="win-button win-button--secondary" href="./index.html">Main Menu</a>
		</nav>
		<section class="win-leaderboard" aria-labelledby="leaderboard-title">
			<h3 id="leaderboard-title">Submit to the leaderboard</h3>
			<input type="text" aria-label="Username" placeholder="Enter Username">
			<input type="password" aria-label="Password" placeholder="Enter Password">
			<a class="win-button win-button--secondary" href="./leaderboard.html">Submit to Leaderboard</a>
		</section>
	</main>

    <footer>
        <p>NeverWord © 2026</p>
	</footer>
</body>
</html>
