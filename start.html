<!DOCTYPE html>
<html lang="en">

    <head>
	    <meta charset="UTF-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	    <title>NeverWord</title> <!--Browser Tab Title-->
	    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	    <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="start.css">
    </head>

    <body>
        <header>
            <h1>NeverWord</h1>
            <h3>Trap your opponent with your vocabulary!</h3>
        </header>

        <main class="container text-center game-screen">
            <h2>Current Letters</h2>
            <p class="current-letters">[LETTERS PLACEHOLDER]</p>
            <h3>Player 2 Chose the Letter: [PLAYER2 LETTER PLACEHOLDER]</h3>
            <h3>Player 1 Choose a Letter</h3>
            <input type="text" class="form-control letter-input" maxlength="1" placeholder="">
            <button type="button" class="btn btn-primary submit-letter">Submit Letter</button>

            <p class="call-bluff">CALL BLUFF!</p>
            <a href="./BluffCalled.html">
                <img src="./BigRedButton.png" width="100" alt="Call bluff">
            </a>
        </main>

        <footer class="game-footer">
            <a href="./index.html">
                <button type="button" class="btn btn-primary">Home</button>
            </a>
            <p>NeverWord © 2026</p>
        </footer>
    </body>
</html>
